# IntPhys2 evaluation config for V-JEPA 2.1 ViT-g/16 @ 384px — 64 frames per clip
# Weights: https://github.com/facebookresearch/vjepa2 (V-JEPA 2.1)
#
# Surprise = L1 between predictor output and target-encoder features, using
# only the LAST of the 4 hierarchical levels (layer 39) of V-JEPA 2.1.
#
# USAGE — local (single GPU):
#   cd prediction_evals/
#   python -m evals.main --devices cuda:0 --fname evals/intphys2/configs/vjepa2_1_vitg_384_fpc64.yaml
#
# USAGE — SLURM cluster (RCS): see main_job_vjepa2_1.sh at the repo root.
#
# The checkpoint (~17 GB) is downloaded once to $TORCH_HOME/hub/checkpoints/.
# Switch `dataset` by hand: intphys2-debug -> intphys2-main.

nodes: 6            # every GPU with >=16 GB: gpu-01,02,04 (16 GB), gpu-05,07 (24 GB), gpu-06 (32 GB)
min_nodes: 1        # start with whatever is free (1..6 nodes); size is fixed once started
tasks_per_node: 1

tag: fpc64
eval_name: intphys2
folder: ./results/vjepa2_1_vitg_384/
resume_checkpoint: false

experiment:
  data:
    batch_size: 1
    resolution: 384
    stride_sliding_window: 2
    use_bfloat16: true
    frames_per_clip: 64
    # Not in the paper's sweep (16/32/48). Contexts follow the same rule:
    # [4,6,8,10,12,14] scaled by 64/16.
    context_lengths: [16, 24, 32, 40, 48, 56]
    frame_steps: 10
    # Windows per forward pass (does not change results); keeps ViT-g under 16 GB VRAM.
    chunk_size: 2
    num_frames_to_pred: -1
    dataset: intphys2-debug
  max_context_mode: true

model_kwargs:
  checkpoint: https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitg_384.pt
  module_name: app.vjepa_2_1.modelcustom.default_wrapper
  wrapper_kwargs:
    mask_index: 0
  pretrain_kwargs:
    resolution: 384
    encoder:
      model_name: vit_giant_xformers
      checkpoint_key: encoder
      patch_size: 16
      tubelet_size: 2
      use_sdpa: true
      use_rope: true
      interpolate_rope: true
      img_temporal_dim_size: 1
      modality_embedding: true
      n_output_distillation: 4
    target_encoder:
      checkpoint_key: target_encoder
    predictor:
      model_name: vit_predictor
      checkpoint_key: predictor
      predictor_embed_dim: 384
      depth: 24
      num_heads: 12
      use_mask_tokens: true
      num_mask_tokens: 8
      use_rope: true
      interpolate_rope: true
      img_temporal_dim_size: 1
      modality_embedding: true
      n_output_distillation: 4
      return_all_tokens: true
